name: CI

on:
  push:
    branches: [Java-8]
  pull_request:
    branches: [Java-8]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build and test
        run: ./mvnw -B -q clean test