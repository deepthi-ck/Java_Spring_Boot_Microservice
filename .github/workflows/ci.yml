name: CI

on:
  push:
    branches: [Java-11]
  pull_request:
    branches: [Java-11]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Build and test
        run: ./mvnw -B clean test